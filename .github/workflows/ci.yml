name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  shell-lint:
    name: Sintaxis y ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar sintaxis (bash -n)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::Error de sintaxis"
              fail=1
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)
          exit "$fail"

      - name: ShellCheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 shellcheck --severity=warning
