# --- Comportamiento general ---
LSO_AUTO_BACKUP=true
LSO_BACKUP_BEFORE_CHANGE=true
LSO_CONFIRM_PERMANENT=true
LSO_MAX_LOG_AGE_DAYS=30
LSO_MAX_BACKUP_AGE_DAYS=90

# --- Límites de optimización ---
LSO_RAM_THRESHOLD=85
LSO_CPU_THRESHOLD=90
LSO_DISK_THRESHOLD=90

# --- ZRAM ---
LSO_ZRAM_ENABLED=false
LSO_ZRAM_SIZE_PERCENT=50

# --- Swap ---
LSO_SWAP_OPTIMIZE=true
LSO_SWAPPINESS=10

# --- Navegadores ---
LSO_BROWSER_CACHE_MAX_DAYS=30
LSO_BROWSER_OPTIMIZE_STARTUP=true

# --- Journald ---
LSO_JOURNAL_MAX_SIZE="500M"
LSO_JOURNAL_MAX_FILES=5

# --- Red ---
LSO_NETWORK_OPTIMIZE_TCP=true
LSO_NETWORK_DNS_OPTIMIZE=false
